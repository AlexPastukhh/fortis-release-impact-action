name: Fortis Release Impact v1
description: Read-only, fail-closed Release Impact and Build Target Catalog validation for pull requests
runs:
  using: composite
  steps:
    - name: Install pinned validator dependencies
      shell: bash
      env:
        FORTIS_ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --disable-pip-version-check -r "$FORTIS_ACTION_PATH/tools/release/requirements.txt"
    - name: Validate exact-head PR Release Impact and changed files
      shell: bash
      env:
        FORTIS_ACTION_PATH: ${{ github.action_path }}
        PYTHONDONTWRITEBYTECODE: "1"
      run: |
        python "$FORTIS_ACTION_PATH/tools/release/ci_entry.py"
